status: candidate
note: >-
  NO MCP SERVER EXISTS. Lakekeeper ships no hosted MCP endpoint and no stdio MCP package — registry.npmjs.org
  returns 404 for `lakekeeper`, `@lakekeeper/mcp` and `lakekeeper-mcp`, PyPI has no Lakekeeper MCP distribution,
  and neither the documentation corpus nor the GitHub organization's 16 repositories contain an MCP server. The
  tools below are a DERIVED CANDIDATE surface — what an MCP server over Lakekeeper's own OpenAPI would expose —
  and nothing here is callable today. No endpoint URL is asserted, because guessing one that happened to answer
  would read as a verified agent surface.
  Worth recording as context: Lakekeeper markets itself as governing "every engine and AI agent" and its whole
  value proposition — short-lived vended credentials, per-table authorization, an audit trail — is exactly the
  control plane an agent-facing MCP server would need. The gap between that positioning and the absent MCP
  surface is the finding.
