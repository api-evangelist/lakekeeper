excluded_from_candidate:
  note: >-
    Deliberately not proposed as agent tools. Table and view mutation on the Iceberg catalog surface (createTable,
    updateTable, commitTransaction, dropTable, dropView, registerTable) is engine work, not agent work — engines
    commit metadata transactions and expect exclusive control of that path. Principal and permission mutation
    (create_user, delete_user, create_role, add_role_members, the 39 permissions-openfga operations) is
    privilege-granting and belongs behind human review. delete_warehouse and delete_project have no reversal path
    at all (see conventions/lakekeeper-conventions.yml reversibility.irreversible).
agent_readiness_notes:
  auth: OIDC/OAuth2 bearer JWT against the operator's own IdP. There is no API-key path.
  idempotency: >-
    Idempotency-Key is supported on the catalog plane with a discoverable 30-minute lifetime, which is the right
    foundation for safe agent retries — but not on the Management plane.
  self_hosting: >-
    Every deployment has a different host, so an MCP server for Lakekeeper would have to be operator-deployed and
    configured, not vendor-hosted. That is a real reason none exists, and also why a candidate list rather than a
    guessed endpoint is the only honest artifact here.
