components:
  schemas:
    ProjectTaskInfo:
      type: object
      required:
      - task-id
      - project-id
      - queue-name
      - status
      - scheduled-for
      - attempt
      - progress
      - created-at
      properties:
        attempt:
          type: integer
          format: int32
          description: Current attempt number
        created-at:
          type: string
          format: date-time
          description: When this task attempt was created
        last-heartbeat-at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last heartbeat timestamp for running tasks
        parent-task-id:
          type:
          - string
          - 'null'
          format: uuid
          description: Parent task ID if this is a sub-task
        picked-up-at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the latest attempt of the task was picked up for processing by a worker.
        progress:
          type: number
          format: float
          description: Progress of the task (0.0 to 1.0)
        project-id:
          type: string
          description: Project ID associated with the task
        queue-name:
          type: string
          description: Name of the queue processing this task
        scheduled-for:
          type: string
          format: date-time
          description: When the latest attempt of the task is scheduled for
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Current status of the task
        task-id:
          type: string
          format: uuid
          description: Unique identifier for the task
        updated-at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the task was last updated
    TabularExpirationQueueConfig:
      type: object
      description: Warehouse-specific configuration for the tabular expiration (Soft-Deletion) queue.
    ScheduleRemoveOrphanFilesTaskRequest:
      type: object
      description: Request body for scheduling a task.
      required:
      - entity
      properties:
        entity:
          $ref: '#/components/schemas/WarehouseTaskEntityId'
          description: 'Entity to schedule the task for. Unsupported entity types return

            `400` from the pre-check.'
        scheduled-for:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the task should run. Omit (or pass `null`) to run on the next

            worker poll. RFC 3339 / ISO 8601 format. Must be within roughly one

            year of now; further-out values return

            `400 ScheduledForTooFarInFuture`.'
          example: 2026-12-31 23:59:59+00:00
    WarehouseTaskInfo:
      type: object
      required:
      - task-id
      - project-id
      - warehouse-id
      - queue-name
      - status
      - scheduled-for
      - attempt
      - progress
      - created-at
      properties:
        attempt:
          type: integer
          format: int32
          description: Current attempt number
        created-at:
          type: string
          format: date-time
          description: When this task attempt was created
        entity:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WarehouseTaskEntityId'
            description: Type of the sub-entity this task operates on. None if this is a warehouse-level task.
        entity-name:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Name of the entity this task operates on. None if this is a warehouse-level task.
        last-heartbeat-at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last heartbeat timestamp for running tasks
        parent-task-id:
          type:
          - string
          - 'null'
          format: uuid
          description: Parent task ID if this is a sub-task
        picked-up-at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the latest attempt of the task was picked up for processing by a worker.
        progress:
          type: number
          format: float
          description: Progress of the task (0.0 to 1.0)
        project-id:
          type: string
          description: Project ID associated with the task
        queue-name:
          type: string
          description: Name of the queue processing this task
        scheduled-for:
          type: string
          format: date-time
          description: When the latest attempt of the task is scheduled for
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Current status of the task
        task-id:
          type: string
          format: uuid
          description: Unique identifier for the task
        updated-at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the task was last updated
        warehouse-id:
          type: string
          format: uuid
          description: Warehouse ID associated with the task
    ErrorModel:
      type: object
      description: JSON error payload returned in a response with further details on the error
      required:
      - message
      - type
      - code
      properties:
        code:
          type: integer
          format: int32
          description: HTTP response code
          minimum: 0
        message:
          type: string
          description: Human-readable error message
        stack:
          type: array
          items:
            type: string
        type:
          type: string
          description: Internal type definition of the error
    WarehouseTaskEntityFilter:
      oneOf:
      - type: object
        description: Get tasks for a specific table
        required:
        - table-id
        - type
        properties:
          table-id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - table
      - type: object
        description: Get tasks for a specific view
        required:
        - view-id
        - type
        properties:
          type:
            type: string
            enum:
            - view
          view-id:
            type: string
            format: uuid
      - type: object
        description: Get tasks for a specific generic table
        required:
        - generic-table-id
        - type
        properties:
          generic-table-id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - generic-table
      - type: object
        description: 'Get Warehouse-level tasks which are not associated with a specific entity

          inside the warehouse'
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - warehouse
    GetRemoveOrphanFilesQueueConfig:
      type: object
      required:
      - queue-config
      properties:
        max-seconds-since-last-heartbeat:
          type:
          - integer
          - 'null'
          format: int64
        queue-config:
          $ref: '#/components/schemas/RemoveOrphanFilesQueueConfig'
    ScheduleExpireSnapshotsTaskRequest:
      type: object
      description: Request body for scheduling a task.
      required:
      - entity
      properties:
        entity:
          $ref: '#/components/schemas/WarehouseTaskEntityId'
          description: 'Entity to schedule the task for. Unsupported entity types return

            `400` from the pre-check.'
        scheduled-for:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the task should run. Omit (or pass `null`) to run on the next

            worker poll. RFC 3339 / ISO 8601 format. Must be within roughly one

            year of now; further-out values return

            `400 ScheduledForTooFarInFuture`.'
          example: 2026-12-31 23:59:59+00:00
    PurgeQueueConfig:
      type: object
    ExpireSnapshotsQueueConfig:
      type: object
      description: 'Warehouse-specific configuration for the expiration queue.

        Parameters can be overridden with table properties. Please see the documentation of each parameter for details.'
      properties:
        enable-expire-snapshots:
          type:
          - boolean
          - 'null'
          description: 'Enable or disable automatic expiration of snapshots for all tables in this warehouse.

            Can be overridden on a per-table level with the table property `lakekeeper.history.expire.enabled`.

            Tables with the `gc.enabled` flag set to false, are also excluded from automatic expiration.'
          default: 'false'
        max-ref-age-ms:
          type:
          - integer
          - 'null'
          format: int64
          description: 'For snapshot references except the main branch, default max age of snapshot references to keep while expiring snapshots.

            The main branch never expires.

            If not set, defaults to `i64::MAX` (no expiration).'
          default: 9223372036854775807
        max-snapshot-age-ms:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Default maximum age of a snapshot in milliseconds before it is considered expired.

            If not set, defaults to `432000000` (5 days).

            Can be overridden on a per-table level with the table property `history.expire.max-snapshot-age-ms`.'
          default: 432000000
        min-snapshots-to-expire:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Minimum number of snapshots that must be eligible for expiration before the job runs.

            This prevents expensive expiration jobs from running when there are only a few snapshots to expire.

            If not set, defaults to `20`.

            Can be overridden on a per-table level with the table property `lakekeeper.history.expire.min-snapshots-to-expire`.'
          default: 20
          minimum: 0
        min-snapshots-to-keep:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Default min number of snapshots to keep on the table and all of its branches while expiring snapshots.

            If not set, defaults to `1`.

            Can be overridden on a per-table level with the table property `history.expire.min-snapshots-to-keep`.'
          default: 1
