    RemoveOrphanFilesQueueConfig:
      type: object
      properties:
        default-older-than-ms:
          type: integer
          format: int64
          description: 'Only remove files older than this duration (in milliseconds).

            Defaults to 604800000 (7 days). **24-hour safety floor** is

            enforced at task pickup (`RemoveOrphanFilesRetentionTooShort`

            error code); values below it cause the worker to refuse to

            run, unless `disable-min-older-than-check` is set on this same

            config. Mirrors Spark''s `retentionDurationCheck.enabled =

            false` escape.


            Negative, zero, or sub-day values still deserialize cleanly —

            the runtime check is what blocks them. Out-of-range i64 values

            that don''t fit in `chrono::TimeDelta` fall back to a zero

            duration rather than panicking.'
          default: 604800000
        disable-min-older-than-check:
          type: boolean
          description: 'Bypass the 24-hour minimum on `default-older-than-ms`. When

            `false` (the default), the worker refuses to run a task whose

            configured retention is shorter than 24h — a typo like

            `default-older-than-ms: 6000` (6 seconds) would otherwise

            silently delete in-flight writer uploads. Set to `true` only

            when you genuinely need sub-day retention (dev/test). Mirrors

            Spark''s `retentionDurationCheck.enabled = false` escape.'
          default: false
        dry-run:
          type: boolean
          description: 'When `true`, identify orphan files but do not delete them. The

            task still completes normally and records `would_delete_count` /

            `would_delete_bytes` in its result; `deleted_bytes` is zero, so

            the adaptive scheduler observes a rate of zero and falls back

            to `maximum-interval-seconds`. Useful for previewing what a

            run would remove before enabling deletion. Defaults to `false`.'
          default: false
        enable-remove-orphan-files:
          type: boolean
          description: 'Master switch for adaptive scheduling on this warehouse. When

            `false` (the default), no tables are scheduled for the orphan-

            files queue unless they have

            `lakekeeper.remove-orphan-files.enabled=true` set explicitly.'
          default: false
        max-run-time-seconds:
          type: integer
          format: int64
          description: 'Maximum wall-clock duration of a single task attempt, in seconds.

            On timeout the task is marked failed and is retried at most once

            before being recorded as a terminal failure. Operators with very

            large tables can raise this; in exchange a single attempt may hold

            a worker slot for the configured duration. Defaults to 3600 (60

            minutes). Must be at least 60.'
          default: 3600
          minimum: 60
        maximum-interval-seconds:
          type: integer
          format: int64
          description: 'Upper bound on the adaptive next-run interval, in seconds. Even

            idle tables get a periodic safety check at this cadence.

            Defaults to 90 days. Must be at least 86400 (1 day).'
          default: 7776000
          minimum: 86400
        target-reclaim-bytes:
          type: integer
          format: int64
          description: 'Discovery-rate target in bytes. The hook schedules the next run

            at the time the previous run''s observed orphan-bytes-per-second

            rate is expected to accumulate this much reclaimable data,

            clamped to the internal floor (1 day) and the configured ceiling

            (`maximum-interval-seconds`). Defaults to 1 GiB.


            `0` is accepted and means "always schedule at the floor (1 day)

            whenever any orphan is found." Useful for setups that want

            scheduling driven solely by the floor/ceiling clamp instead of

            by observed rate.'
          default: 1073741824
          minimum: 0
