openapi: 3.2.0
info:
  title: Lakekeeper＋ Management Tasks API
  description: Lakekeeper is a rust-native Apache Iceberg REST Catalog implementation. The Management API provides endpoints to manage the server, projects, warehouses, users, and roles. If Authorization is enabled, permissions can also be managed. An interactive Swagger-UI for the specific Lakekeeper Version and configuration running is available at `/swagger-ui/#/` of Lakekeeper (by default http://localhost:8181/swagger-ui/#/).
  license:
    name: Vakamo Enterprise License
  version: 0.0.0
servers:
- url: '{scheme}://{host}{basePath}'
  description: Lakekeeper Management API
  variables:
    basePath:
      default: ''
      description: Optional path prefix (starting with '/') to be prepended to all routes
    host:
      default: localhost
      description: The host (and optional port) for the specified server
    scheme:
      default: https
      description: The scheme of the URI, either http or https
security:
- bearerAuth: []
tags:
- name: Tasks
  description: View & Manage Tasks
paths:
  /management/v1/project/task-queue/task_log_cleanup/config:
    get:
      tags:
      - Tasks
      summary: Get the configuration for a Project-level Task Queue
      description: These configurations are global per project and shared across all instances of this kind of task.
      operationId: get_project_task_queue_config_task_log_cleanup
      parameters:
      - name: x-project-id
        in: header
        description: Project ID (optional; falls back to the default project if not provided)
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: ''
          headers:
            x-request-id:
              schema:
                type: string
                format: uuid
              description: Request identifier, add this to your bug reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskLogCleanupConfig'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
    post:
      tags:
      - Tasks
      summary: Set the configuration for a Project-level Task Queue
      description: These configurations are global per project and shared across all instances of this kind of task.
      operationId: set_project_task_queue_config_task_log_cleanup
      parameters:
      - name: x-project-id
        in: header
        description: Project ID (optional; falls back to the default project if not provided)
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaskLogCleanupConfig'
        required: true
      responses:
        '204':
          description: Project-level Task queue config set successfully
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/project/task/by-id/{task_id}:
    get:
      tags:
      - Tasks
      summary: Get Details about a specific Project-level task by its ID
      operationId: get_project_task_details
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: numAttempts
        in: query
        description: 'Number of attempts to retrieve (default: 5)'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          default: 5
          minimum: 0
      - name: x-project-id
        in: header
        description: Project ID (optional; falls back to the default project if not provided)
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectTaskDetailsResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/project/task/control:
    post:
      tags:
      - Tasks
      summary: Control a set of Project-level tasks by their IDs (e.g., cancel, request stop…
      description: Accepts at most 100 task IDs in one request.
      operationId: control_project_tasks
      parameters:
      - name: x-project-id
        in: header
        description: Project ID (optional; falls back to the default project if not provided)
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlTasksRequest'
        required: true
      responses:
        '204':
          description: All requested actions were successful
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/project/task/list:
    post:
      tags:
      - Tasks
      summary: List active and historic Project-level tasks
      operationId: list_project_tasks
      parameters:
      - name: x-project-id
        in: header
        description: Project ID (optional; falls back to the default project if not provided)
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListProjectTasksRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectTasksResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/warehouse/{warehouse_id}/task-queue/expire_snapshots/config:
    get:
      tags:
      - Tasks
      summary: Get the configuration for a Task Queue
      description: These configurations are global per warehouse and shared across all instances of this kind of task.
      operationId: get_task_queue_config_expire_snapshots
      parameters:
