      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - list_namespaces
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - list_everything
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - set_protection
      - type: object
        required:
