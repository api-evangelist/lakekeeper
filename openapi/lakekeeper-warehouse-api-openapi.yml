          action:
            type: string
            enum:
            - list_generic_tables
    GcsCredential:
      oneOf:
      - type: object
        title: GcsCredentialServiceAccountKey
        description: 'Service Account Key


          The key is the JSON object obtained when creating a service account key in the GCP console.'
        required:
        - key
        - credential-type
        properties:
          credential-type:
            type: string
            enum:
            - service-account-key
          key:
            $ref: '#/components/schemas/GcsServiceKey'
      - type: object
        title: GcsCredentialSystemIdentity
        description: 'GCP System Identity


