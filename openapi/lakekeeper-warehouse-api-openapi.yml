            schema:
              $ref: '#/components/schemas/SetProtectionRequest'
        required: true
      responses:
        '200':
          description: Table protection set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/warehouse/{warehouse_id}/view/{view_id}/actions:
    get:
      tags:
      - Warehouse
      summary: Get allowed actions for a view
      operationId: get_view_actions
      parameters:
      - name: principalUser
        in: query
        description: 'The user to show actions for.

          If neither user nor role is specified, shows actions for the current user.'
        required: false
        schema:
          type: string
      - name: principalRole
        in: query
        description: 'The role to show actions for.

          If neither user nor role is specified, shows actions for the current user.'
        required: false
        schema:
          type: string
          format: uuid
      - name: warehouse_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLakekeeperViewActionsResponse'
        4XX:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
  /management/v1/warehouse/{warehouse_id}/view/{view_id}/protection:
    get:
