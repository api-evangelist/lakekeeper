          description: Enable SAS-token generation. Defaults to true.
        sas-token-validity-seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: 'SAS-token validity in seconds. Default: 3600. Max: 3600 (`OneLake` cap).'
          minimum: 0
        storage-layout:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StorageLayout'
            description: Storage layout for namespace and tabular paths.
        top-level-folder:
          $ref: '#/components/schemas/TopLevelFolder'
          description: Top-level managed folder. Defaults to `Files`.
        workspace-id:
          type: string
          format: uuid
          description: UUID of the Fabric workspace this warehouse lives in.
    StorageLayout:
      oneOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - default
      - allOf:
        - $ref: '#/components/schemas/StorageLayoutFlat'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - tabular-only
      - allOf:
        - $ref: '#/components/schemas/StorageLayoutFullHierarchy'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - full-hierarchy
      description: "Controls how namespace and tabular paths are constructed under the warehouse base location.\n\n- `default` / omitted: flat — no namespace directories; all tabulars are placed directly under\n  the base location with a fixed `\"{uuid}\"` segment. (Changed in 0.13; before 0.13 the default\n  emitted a `\"{uuid}\"` directory for the direct-parent namespace. Existing namespaces created\n  before 0.13 keep their persisted location, so only namespaces created on/after 0.13 use the\n  flat default.)\n- `full-hierarchy`: one directory per namespace level, one per tabular.\n- `tabular-only`: no namespace directories; all tabulars are placed directly under the base\n  location, with a configurable tabular template (which must contain `{uuid}`).\n\nSegment templates may use `{uuid}` and `{name}` as placeholders."
      example:
        type: full-hierarchy
        namespace: '{name}-{uuid}'
        tabular: '{name}-{uuid}'
    S3Profile:
      type: object
      required:
      - bucket
      - region
      - sts-enabled
      properties:
        allow-alternative-protocols:
          type:
          - boolean
          - 'null'
          description: 'Allow `s3a://` and `s3n://` in locations.

            This is disabled by default. We do not recommend to use this setting

            except for migration of old hadoop-based tables via the register endpoint.

            Tables with `s3a` paths are not accessible outside the Java ecosystem.'
        assume-role-arn:
          type:
          - string
          - 'null'
          description: Optional ARN to assume when accessing the bucket from Lakekeeper.
        aws-kms-key-arn:
          type:
          - string
          - 'null'
          description: ARN of the KMS key used to encrypt the S3 bucket, if any.
        bucket:
          type: string
          description: Name of the S3 bucket
        endpoint:
          type:
          - string
          - 'null'
          format: uri
          description: 'Optional endpoint to use for S3 requests, if not provided

            the region will be used to determine the endpoint.

            If both region and endpoint are provided, the endpoint will be used.

            Example: `http://s3-de.my-domain.com:9000`'
        flavor:
          $ref: '#/components/schemas/S3Flavor'
          description: 'S3 flavor to use.

            Defaults to AWS'
        key-prefix:
          type:
          - string
          - 'null'
          description: Subpath in the bucket to use.
        legacy-md5-behavior:
          type:
          - boolean
          - 'null'
          description: 'Legacy MD5 behavior for S3 operations requiring checksums.

            When enabled, Lakekeeper will use the legacy MD5 checksum for operations like `DeleteObjects`.'
        path-style-access:
          type:
          - boolean
          - 'null'
          description: 'Path style access for S3 requests.

            If the underlying S3 supports both, we recommend to not set `path_style_access`.'
        push-s3-delete-disabled:
          type: boolean
          description: 'Controls whether the `s3.delete-enabled=false` flag is sent to clients.


            In all Iceberg 1.x versions, when Spark executes `DROP TABLE xxx PURGE`, it directly

            deletes files from S3, bypassing the catalog''s soft-deletion mechanism.

            Other query engines properly delegate this operation to the catalog.

            This Spark behavior is expected to change in Iceberg 2.0.


            Setting this to `true` pushes the `s3.delete-enabled=false` flag to clients,

            which discourages Spark from directly deleting files during `DROP TABLE xxx PURGE` operations.

            Note that clients may override this setting, and it affects other Spark operations

            that require file deletion, such as removing snapshots.


            For more details, refer to Lakekeeper''s

            [Soft-Deletion documentation](https://docs.lakekeeper.io/docs/nightly/concepts/#soft-deletion).

            This flag has no effect if Soft-Deletion is disabled for the warehouse.'
        region:
          type: string
          description: Region to use for S3 requests.
        remote-signing-enabled:
          type: boolean
          description: 'Enable remote signing for S3 requests.

            When disabled, clients cannot use remote signing even if STS is disabled.

            Defaults to true.'
        remote-signing-url-style:
          $ref: '#/components/schemas/S3UrlStyleDetectionMode'
          description: "S3 URL style detection mode for remote signing.\nOne of `auto`, `path-style`, `virtual-host`.\nDefault: `auto`. When set to `auto`, Lakekeeper will first try to parse the URL as\n`virtual-host` and then attempt `path-style`.\n`path` assumes the bucket name is the first path segment in the URL. `virtual-host`\nassumes the bucket name is the first subdomain if it is preceding `.s3` or `.s3-`.\n\nExamples\n\nVirtual host:\n  - <https://bucket.s3.endpoint.com/bar/a/key>\n  - <https://bucket.s3-eu-central-1.amazonaws.com/file>\n\nPath style:\n  - <https://s3.endpoint.com/bucket/bar/a/key>\n  - <https://s3.us-east-1.amazonaws.com/bucket/file>"
        storage-layout:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StorageLayout'
            description: Storage layout for namespace and tabular paths.
        sts-enabled:
          type: boolean
        sts-endpoint:
          type:
          - string
          - 'null'
          format: uri
          description: 'Optional endpoint to use for STS requests.

            Use this when the STS endpoint differs from the S3 endpoint,

            which is common with S3-compatible storage systems.

            If not provided, the S3 `endpoint` is used for STS requests as well.'
        sts-role-arn:
          type:
          - string
          - 'null'
          description: 'Optional role ARN to assume for sts vended-credentials.

            If not provided, `assume_role_arn` is used.

            Either `assume_role_arn` or `sts_role_arn` must be provided if `sts_enabled` is true.'
        sts-session-tags:
          type: object
          description: Optional session tags for STS assume role operations.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        sts-token-validity-seconds:
          type: integer
          format: int64
          description: The validity of the sts tokens in seconds. Default is 3600
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
