            type: object
            required:
            - action
            - warehouse-id
            properties:
              action:
                $ref: '#/components/schemas/WarehouseAction'
              warehouse-id:
                type: string
                format: uuid
      - type: object
        required:
        - namespace
        properties:
          namespace:
            allOf:
            - $ref: '#/components/schemas/NamespaceIdentOrUuid'
            - type: object
              required:
              - action
