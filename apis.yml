aid: lakekeeper
name: Lakekeeper
description: >-
  Lakekeeper is an open-source Apache Iceberg REST Catalog written in Rust and maintained by Vakamo. It manages
  Iceberg tables, views and namespaces for query engines such as Apache Spark, Trino, StarRocks, DuckDB, Athena,
  Flink and PyIceberg, vending short-lived, prefix-scoped storage credentials for S3, GCS, Azure ADLS and Microsoft
  OneLake/Fabric instead of handing long-lived keys to engines. It exposes three distinct HTTP APIs — the standard
  Iceberg REST Catalog API at /catalog/v1, a Lakekeeper-specific Management API at /management/v1 for bootstrapping,
  projects, warehouses, users, roles, tasks and fine-grained permissions, and a Data API at /lakekeeper/v1 that
  catalogs non-Iceberg generic tables such as Lance, Delta and Parquet. Authorization is pluggable (OpenFGA for RBAC/
  ReBAC, Open Policy Agent bridge, Cedar in the commercial Lakekeeper+ distribution), authentication is OIDC/OAuth2
  or Kubernetes service accounts, and change events are published as CloudEvents to Kafka or NATS. Lakekeeper is
  self-hosted software under Apache 2.0; commercial Lakekeeper+ and Lakekeeper Cloud are sold by Vakamo.
