apis:
- name: Lakekeeper Generic Table (Data) API
  description: >-
    Lakekeeper's data-plane API served under /lakekeeper/v1, cataloging non-Iceberg table formats — Lance,
    Delta, CSV, Parquet — alongside Iceberg tables in the same Warehouse and Namespace, with the same
    credential vending and access control. Six operations across four paths covering list, create, load
    and drop of generic tables, plus a referenced-by lookup. Consumed by the official pylakekeeper Python
    client and the Lakekeeper Java/Spark clients.
  humanURL: https://docs.lakekeeper.io/docs/latest/generic-tables/
  baseURL: '{scheme}://{host}/lakekeeper/v1'
  tags:
  - Data Catalog
  - Lakehouse
  - Metadata
  - Data Engineering
