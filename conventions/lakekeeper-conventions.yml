  errors: errors/lakekeeper-problem-types.yml
  lifecycle: lifecycle/lakekeeper-lifecycle.yml
  authentication: authentication/lakekeeper-authentication.yml
  rate_limits: rate-limits/lakekeeper-rate-limits.yml
  scopes: scopes/lakekeeper-scopes.yml
