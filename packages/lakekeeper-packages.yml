note: >-
  Lakekeeper is self-hosted software, so its "packages" split into two groups: client libraries that talk to a
  running Lakekeeper, and distribution artifacts that ARE Lakekeeper. Client libraries live in the
  lakekeeper/lakekeeper-clients monorepo (Python, Java, Java/Spark) plus a separate Go client. Note that the Java
  and Java/Spark clients are published to GitHub Packages, not Maven Central — a Maven Central search for
  "lakekeeper" returns 0 results — and GitHub Packages has no unauthenticated metadata endpoint, so their latest
  versions could not be read and are recorded as null rather than guessed. The Rust server crates are NOT published
  to crates.io (a crates.io search for "lakekeeper" returns no crate of that name); the server is distributed as a
  container image, a prebuilt binary and a Helm chart.
